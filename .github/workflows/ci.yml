name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess

          ZERO_SHA = "0" * 40
          IMAGE_EXTS = (".png", ".svg", ".gif", ".webp", ".jpg", ".jpeg", ".ico", ".mp4", ".cast")

          def git(*args: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=False)

          def emit(val: bool, reason: str) -> None:
              print(f"cordis-changes: {reason} -> code={val}")
              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  with open(out, "a", encoding="utf-8") as fh:
                      fh.write(f"code={'true' if val else 'false'}\n")

          def changed_files(base: str) -> list[str] | None:
              if git("cat-file", "-e", f"{base}^{{commit}}").returncode != 0:
                  if git("fetch", "--no-tags", "--depth=1", "origin", base).returncode != 0:
                      return None
              res = git("diff", "--name-only", "--no-renames", "-z", base, "HEAD", "--")
              if res.returncode != 0:
                  return None
              return [p for p in res.stdout.split("\0") if p]

          def is_docs_only(path: str) -> bool:
              return (
                  path.startswith("docs/")
                  or fnmatch.fnmatch(path, "README*.md")
                  or path.lower().endswith(IMAGE_EXTS)
                  or path in (
                      "CHANGELOG.md",
                      "LICENSE",
                      "SECURITY.md",
                      ".gitignore",
                      "release-please-config.json",
                      ".release-please-manifest.json",
                  )
              )

          event = os.environ.get("EVENT_NAME", "")
          if event == "workflow_dispatch":
              emit(True, "workflow_dispatch runs full CI")
          elif event == "pull_request":
              if git("rev-parse", "--verify", "HEAD^2").returncode == 0:
                  files = changed_files("HEAD^1")
              else:
                  base = os.environ.get("PR_BASE_SHA", "")
                  files = changed_files(base) if base else None
              emit(True if not files else any(not is_docs_only(p) for p in files), "pull_request")
          elif event == "push":
              before = os.environ.get("PUSH_BEFORE_SHA", "")
              has_parent = git("rev-parse", "--verify", "HEAD^1").returncode == 0
              if not has_parent or not before or before == ZERO_SHA:
                  emit(True, "orphan or initial push")
              else:
                  files = changed_files(before)
                  emit(True if not files else any(not is_docs_only(p) for p in files), "push")
          else:
              emit(True, f"event {event!r}")
          PY

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load pinned tool versions from mise.toml
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          text = pathlib.Path("mise.toml").read_text(encoding="utf-8")
          tools = tomllib.loads(text)["tools"]
          lua_ver = tools["lua"]
          stylua_ver = tools["stylua"]
          m = re.search(r'(?m)^lua\s*=\s*"[^"]+"\s*#\s*sha256:\s*([0-9a-f]{64})\s*$', text)
          assert m, "mise.toml lua entry must declare '# sha256: <64-hex>'"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"lua_version={lua_ver}\n")
              fh.write(f"lua_sha256={m.group(1)}\n")
              fh.write(f"stylua_version={stylua_ver}\n")
          PY

      - name: Build Lua from source
        shell: bash
        env:
          LUA_VER: ${{ steps.tools.outputs.lua_version }}
          LUA_SHA: ${{ steps.tools.outputs.lua_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSLO "https://www.lua.org/ftp/lua-${LUA_VER}.tar.gz"
          printf '%s  lua-%s.tar.gz\n' "${LUA_SHA}" "${LUA_VER}" | sha256sum -c -
          tar xzf "lua-${LUA_VER}.tar.gz"
          make -C "lua-${LUA_VER}" linux -j"$(nproc)"
          echo "$PWD/lua-${LUA_VER}/src" >> "$GITHUB_PATH"

      - name: CI policy check
        run: python3 test/ci_policy.py

      - name: Test (deferred spawn)
        run: lua test/run.lua

      - name: Test (eager spawn)
        run: lua test/run.lua --eager

      - name: Test (deferred spawn + contexts)
        run: lua test/run.lua --contexts

      - name: Test (eager spawn + contexts)
        run: lua test/run.lua --eager --contexts

      - name: Syntax check
        run: find lua test -name '*.lua' -print0 | xargs -0 -n1 luac -p

      - name: Install stylua
        shell: bash
        env:
          STYLUA_VER: ${{ steps.tools.outputs.stylua_version }}
        run: |
          set -euo pipefail
          curl -fsSL -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VER}/stylua-linux-x86_64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -q stylua.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: stylua --check lua test

      - name: Port status check
        run: lua test/kit/port_check.lua
